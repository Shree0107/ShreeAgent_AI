<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ShreeAgent AI: trading analysis and plans. Analysis only, no orders are placed." />
    <title>ShreeAgent AI</title>
    <script>
      // Apply the saved theme before first paint (no flash of the wrong theme).
      try {
        var t = localStorage.getItem('sa-theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
