# FRED series used for forex fundamentals, per currency.
#   policy_rate : central bank policy rate (percent)
#   cpi         : consumer price INDEX (YoY inflation is computed from it)
#   bond_10y    : 10-year government bond yield (percent)
#   gdp         : real GDP level (YoY growth is computed from it)
# Find or verify series at https://fred.stlouisfed.org (search the name and copy the ID).
# If FRED discontinues a series, the app shows "n/a" for it. Replace the ID here.
# inflation_target: central bank target (percent), used for the hawkish/dovish lean.

USD:
  name: United States
  central_bank: Federal Reserve
  policy_rate: DFF
  cpi: CPIAUCSL
  bond_10y: DGS10
  gdp: GDPC1
  inflation_target: 2.0
EUR:
  name: Euro Area
  central_bank: ECB
