# One command starts the whole platform:
#   docker compose up -d --build            -> open http://localhost:8080
# Optional extras:
#   docker compose --profile legacy up -d   -> classic Streamlit dashboard on http://localhost:8501
#   docker compose --profile alerts up -d   -> daily WhatsApp watchlist scan
# NVIDIA GPU for TimesFM: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
#
# backend = API + WebSocket hub + live prices (OANDA stream / polling) + analysis scheduler + background jobs
# web     = the React app, served by nginx, which forwards /api and /ws to the backend
services:
  backend:
    build: .
    image: shreeagent-ai
    env_file: .env
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8000:8000"         # API docs at http://localhost:8000/docs (local machine only)
    volumes:
      - hf-models:/models/hf          # TimesFM / FinBERT weights (downloaded once)
      - app-cache:/app/.cache          # market data cache, logs, backtest results
      - ./user_data:/app/user_data     # watchlist, drawings, signal history (editable from the host)
    restart: unless-stopped

  web:
    build: ./web
    image: shreeagent-ai-web
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

  streamlit:
    image: shreeagent-ai
    profiles: ["legacy"]
    depends_on: [backend]
    env_file: .env
    command: ["streamlit", "run", "ui/app.py", "--server.address=0.0.0.0", "--server.port=8501", "--server.headless=true"]
    ports:
      - "8501:8501"
    volumes:
      - hf-models:/models/hf
      - app-cache:/app/.cache
      - ./user_data:/app/user_data
    restart: unless-stopped

  scheduler:
    image: shreeagent-ai
    profiles: ["alerts"]
    depends_on: [backend]
    env_file: .env
    command: ["python", "-m", "alerts.scheduler"]
    volumes:
      - hf-models:/models/hf
      - app-cache:/app/.cache
      - ./user_data:/app/user_data
    restart: unless-stopped

volumes:
  hf-models:
  app-cache:
